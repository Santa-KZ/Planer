<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <title>Планировщик</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: Arial, Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      overscroll-behavior-y: contain;
    }

    body.dragging-active {
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      touch-action: none;
    }

    #list {
      padding: 28px 24px 120px 24px;
      min-height: 100vh;
    }

    .row {
      position: relative;
      min-height: 23.2px;
      width: 100%;
      outline: none;
      background: transparent;
      word-break: break-word;
      white-space: pre-wrap;
      padding: 0;
      margin: 0;
      caret-color: #1a73e8;
      -webkit-touch-callout: none;
    }

    .row.drag-placeholder {
      opacity: 0;
    }

    .drag-ghost {
      position: fixed;
      left: 24px;
      right: 24px;
      background: #ffffff;
      color: #000000;
      font-family: Arial, Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      min-height: 23.2px;
      padding: 2px 6px;
      margin-left: -6px;
      border-radius: 4px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.16);
      pointer-events: none;
      z-index: 1000;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #add-btn {
      position: fixed;
      right: 22px;
      top: 22px;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      border: none;
      background-color: #e8e0f5;
      color: #1f1f1f;
      font-size: 30px;
      font-weight: 400;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      z-index: 900;
      user-select: none;
      -webkit-user-select: none;
    }

    #add-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div id="list"></div>
  <button id="add-btn" type="button" aria-label="Добавить задачу">+</button>

  <script>
    const STORAGE_KEY = 'minimal_docs_planner_v1';
    const listEl = document.getElementById('list');
    const addBtn = document.getElementById('add-btn');

    let items = [];
    let selectedId = null;

    let dragTimer = null;
    let isDragging = false;
    let dragId = null;
    let dragGhost = null;
    let dragOffsetY = 0;
    let startX = 0;
    let startY = 0;
    let suppressClick = false;

    let lastTapId = null;
    let lastTapTime = 0;

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed;
          }
        }
      } catch (e) {}
      return [
        { id: uid(), text: 'Задача 1' },
        { id: uid(), text: 'Задача 2' },
        { id: uid(), text: 'Задача 3' },
        { id: uid(), text: '' },
        { id: uid(), text: 'Задача 4' },
        { id: uid(), text: '' },
        { id: uid(), text: '' },
        { id: uid(), text: 'Задача 5' }
      ];
    }

    function saveItems() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch (e) {}
    }

    function focusRow(id, toEnd = true) {
      const el = listEl.querySelector(`[data-id="${id}"]`);
      if (!el) return;
      selectedId = id;
      el.focus();
      if (toEnd) {
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(el);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }

    function insertAfter(targetId, text = '') {
      const newItem = { id: uid(), text };
      const idx = items.findIndex(i => i.id === targetId);
      if (idx === -1) {
        items.push(newItem);
      } else {
        items.splice(idx + 1, 0, newItem);
      }
      saveItems();
      render();
      focusRow(newItem.id, true);
    }

    function deleteItem(id, focusPrev = false) {
      const idx = items.findIndex(i => i.id === id);
      if (idx === -1) return;
      items.splice(idx, 1);
      if (items.length === 0) {
        items.push({ id: uid(), text: '' });
      }
      if (selectedId === id) {
        selectedId = items[Math.max(0, idx - 1)].id;
      }
      saveItems();
      render();
      if (focusPrev) {
        const prevItem = items[Math.max(0, idx - 1)];
        if (prevItem) focusRow(prevItem.id, true);
      }
    }

    function startDrag(id, clientY) {
      const el = listEl.querySelector(`[data-id="${id}"]`);
      if (!el) return;

      isDragging = true;
      dragId = id;
      suppressClick = true;

      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      const sel = window.getSelection();
      if (sel) sel.removeAllRanges();

      if (navigator.vibrate) {
        try { navigator.vibrate(25); } catch (e) {}
      }

      const rect = el.getBoundingClientRect();
      dragOffsetY = clientY - rect.top;

      dragGhost = document.createElement('div');
      dragGhost.className = 'drag-ghost';
      dragGhost.textContent = el.textContent || ' ';
      dragGhost.style.top = rect.top + 'px';
      document.body.appendChild(dragGhost);

      el.classList.add('drag-placeholder');
      document.body.classList.add('dragging-active');
    }

    function moveDrag(clientY) {
      if (!isDragging || !dragGhost) return;
      dragGhost.style.top = (clientY - dragOffsetY) + 'px';

      const rows = Array.from(listEl.children);
      const currentIdx = items.findIndex(i => i.id === dragId);
      if (currentIdx === -1) return;

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const rowId = row.dataset.id;
        if (rowId === dragId) continue;
        const rect = row.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;

        if (i < currentIdx && clientY < midY) {
          const [moved] = items.splice(currentIdx, 1);
          items.splice(i, 0, moved);
          listEl.insertBefore(listEl.querySelector(`[data-id="${dragId}"]`), row);
          saveItems();
          break;
        } else if (i > currentIdx && clientY > midY) {
          const [moved] = items.splice(currentIdx, 1);
          items.splice(i, 0, moved);
          listEl.insertBefore(listEl.querySelector(`[data-id="${dragId}"]`), row.nextSibling);
          saveItems();
          break;
        }
      }
    }

    function endDrag() {
      clearTimeout(dragTimer);
      dragTimer = null;
      if (!isDragging) return;

      const el = listEl.querySelector(`[data-id="${dragId}"]`);
      if (el) el.classList.remove('drag-placeholder');
      if (dragGhost) {
        dragGhost.remove();
        dragGhost = null;
      }

      document.body.classList.remove('dragging-active');
      isDragging = false;
      dragId = null;
      saveItems();

      setTimeout(() => { suppressClick = false; }, 150);
    }

    function createRowEl(item) {
      const div = document.createElement('div');
      div.className = 'row';
      div.contentEditable = 'true';
      div.spellcheck = false;
      div.dataset.id = item.id;
      div.textContent = item.text;

      div.addEventListener('focus', () => {
        selectedId = item.id;
      });

      div.addEventListener('beforeinput', (e) => {
        if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak') {
          e.preventDefault();
          insertAfter(item.id, '');
        }
      });

      div.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          insertAfter(item.id, '');
        } else if (e.key === 'Backspace' && div.textContent === '') {
          e.preventDefault();
          deleteItem(item.id, true);
        }
      });

      div.addEventListener('input', () => {
        const cleanText = div.textContent.replace(/\n/g, '');
        if (cleanText !== div.textContent) {
          div.textContent = cleanText;
          focusRow(item.id, true);
        }
        item.text = cleanText;
        saveItems();
      });

      div.addEventListener('contextmenu', (e) => {
        if (isDragging || dragTimer) {
          e.preventDefault();
        }
      });

      div.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        const t = e.touches[0];
        startX = t.clientX;
        startY = t.clientY;
        selectedId = item.id;

        clearTimeout(dragTimer);
        dragTimer = setTimeout(() => {
          startDrag(item.id, t.clientY);
        }, 300);
      }, { passive: true });

      div.addEventListener('touchmove', (e) => {
        if (e.touches.length !== 1) return;
        const t = e.touches[0];
        if (!isDragging) {
          if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) {
            clearTimeout(dragTimer);
            dragTimer = null;
          }
        } else {
          e.preventDefault();
          moveDrag(t.clientY);
        }
      }, { passive: false });

      div.addEventListener('touchend', (e) => {
        const wasDragging = isDragging;
        endDrag();
        if (wasDragging) return;

        const t = e.changedTouches[0];
        if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) return;

        const now = Date.now();
        if (lastTapId === item.id && (now - lastTapTime) < 300) {
          e.preventDefault();
          lastTapId = null;
          lastTapTime = 0;
          if (item.text.trim() !== '') {
            deleteItem(item.id, false);
          }
        } else {
          lastTapId = item.id;
          lastTapTime = now;
        }
      });

      div.addEventListener('touchcancel', () => {
        endDrag();
      });

      div.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        startX = e.clientX;
        startY = e.clientY;
        selectedId = item.id;

        clearTimeout(dragTimer);
        dragTimer = setTimeout(() => {
          startDrag(item.id, e.clientY);
        }, 300);
      });

      div.addEventListener('dblclick', (e) => {
        if (suppressClick) return;
        if (item.text.trim() !== '') {
          e.preventDefault();
          deleteItem(item.id, false);
        }
      });

      return div;
    }

    window.addEventListener('mousemove', (e) => {
      if (!isDragging && dragTimer) {
        if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) {
          clearTimeout(dragTimer);
          dragTimer = null;
        }
      } else if (isDragging) {
        e.preventDefault();
        moveDrag(e.clientY);
      }
    });

    window.addEventListener('mouseup', () => {
      endDrag();
    });

    function render() {
      listEl.innerHTML = '';
      for (const item of items) {
        listEl.appendChild(createRowEl(item));
      }
    }

    addBtn.addEventListener('click', (e) => {
      e.preventDefault();
      insertAfter(selectedId, '');
    });

    items = loadItems();
    render();
  </script>
</body>
</html>
