<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <title>Планировщик</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: Arial, Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      overscroll-behavior-y: contain;
    }

    body {
      padding-bottom: 120px;
    }

    body.dragging-active {
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      touch-action: none;
    }

    #list {
      padding-top: 28px;
      overflow-x: clip;
    }

    .row {
      display: block;
      position: relative;
      min-height: 23.2px;
      width: 100%;
      outline: none;
      background: transparent;
      word-break: break-word;
      white-space: pre-wrap;
      padding: 0 24px;
      margin: 0;
      caret-color: #1a73e8;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      will-change: transform, opacity;
    }

    .row.editing {
      user-select: text;
      -webkit-user-select: text;
    }

    .row.drag-placeholder {
      opacity: 0;
    }

    .drag-ghost {
      position: fixed;
      left: 24px;
      right: 24px;
      background: #f5f5f5;
      color: #000000;
      font-family: Arial, Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      min-height: 23.2px;
      padding: 2px 6px;
      margin-left: -6px;
      border-radius: 4px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      z-index: 1000;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #archive {
      display: none;
      margin-top: 116px;
      overflow-x: clip;
    }

    .archive-row {
      display: block;
      position: relative;
      min-height: 23.2px;
      width: 100%;
      color: #777777;
      text-decoration: line-through;
      word-break: break-word;
      white-space: pre-wrap;
      padding: 4px 24px;
      margin: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      will-change: transform, opacity;
    }

    #save-btn {
      position: fixed;
      right: 22px;
      top: 22px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background-color: #e8e0f5;
      color: #1f1f1f;
      font-size: 20px;
      font-weight: 600;
      line-height: 1;
      opacity: 0.3;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      z-index: 900;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
    }

    #save-btn:active,
    #save-btn.saved {
      transform: scale(0.95);
      background-color: #d4c6eb;
      opacity: 0.55;
    }
  </style>
</head>
<body>
  <div id="list"></div>
  <div id="archive"></div>
  <button id="save-btn" type="button" aria-label="Сохранить">S</button>

  <script>
    const STORAGE_KEY = 'minimal_docs_planner_v1';
    const BACKUP_KEY = 'minimal_docs_planner_backup_v1';
    const ARCHIVE_KEY = 'minimal_docs_planner_archive_v1';
    const ARCHIVE_TTL = 3 * 24 * 60 * 60 * 1000;
    const SWIPE_THRESHOLD = 90;

    const listEl = document.getElementById('list');
    const archiveEl = document.getElementById('archive');
    const saveBtn = document.getElementById('save-btn');

    let items = [];
    let archive = [];
    let selectedId = null;

    let dragTimer = null;
    let isDragging = false;
    let dragId = null;
    let dragGhost = null;
    let dragOffsetY = 0;
    let startX = 0;
    let startY = 0;
    let suppressClick = false;
    let saveFlashTimer = null;

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function syncActiveRowFromDom() {
      const active = document.activeElement;
      if (active && active.classList && active.classList.contains('row')) {
        const id = active.dataset.id;
        const found = items.find(i => i.id === id);
        if (found) {
          found.text = active.textContent.replace(/\n/g, '');
        }
      }
    }

    function parseListPayload(raw) {
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) {
        return parsed;
      }
      return null;
    }

    function loadItems() {
      const keys = [STORAGE_KEY, BACKUP_KEY];
      for (const key of keys) {
        try {
          const parsed = parseListPayload(localStorage.getItem(key));
          if (parsed) return parsed;
        } catch (e) {}
      }
      return [
        { id: uid(), text: 'Задача 1' },
        { id: uid(), text: 'Задача 2' },
        { id: uid(), text: 'Задача 3' },
        { id: uid(), text: '' },
        { id: uid(), text: 'Задача 4' },
        { id: uid(), text: '' },
        { id: uid(), text: '' },
        { id: uid(), text: 'Задача 5' }
      ];
    }

    function saveItems(forceSyncDom = false) {
      if (forceSyncDom) {
        syncActiveRowFromDom();
      }
      try {
        const payload = JSON.stringify(items);
        localStorage.setItem(STORAGE_KEY, payload);
        localStorage.setItem(BACKUP_KEY, payload);
      } catch (e) {}
    }

    function loadArchive() {
      try {
        const raw = localStorage.getItem(ARCHIVE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            const now = Date.now();
            const fresh = parsed.filter(item => item && item.text && (now - item.deletedAt) <= ARCHIVE_TTL);
            if (fresh.length !== parsed.length) {
              localStorage.setItem(ARCHIVE_KEY, JSON.stringify(fresh));
            }
            return fresh;
          }
        }
      } catch (e) {}
      return [];
    }

    function saveArchive() {
      try {
        const now = Date.now();
        archive = archive.filter(item => (now - item.deletedAt) <= ARCHIVE_TTL);
        localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive));
      } catch (e) {}
    }

    function flushAllState() {
      saveItems(true);
      saveArchive();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        flushAllState();
      }
    });

    window.addEventListener('pagehide', flushAllState);
    window.addEventListener('beforeunload', flushAllState);

    function isCaretAtStart(el) {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return false;
      const range = sel.getRangeAt(0);
      if (!el.contains(range.startContainer)) return false;
      if (!range.collapsed) return false;
      const preRange = range.cloneRange();
      preRange.selectNodeContents(el);
      preRange.setEnd(range.startContainer, range.startOffset);
      return preRange.toString().length === 0;
    }

    function focusRow(id, toEnd = true) {
      const el = listEl.querySelector(`[data-id="${id}"]`);
      if (!el) return;
      selectedId = id;
      el.contentEditable = 'true';
      el.classList.add('editing');
      el.focus();
      if (toEnd) {
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(el);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }

    function insertBefore(targetId, text = '') {
      syncActiveRowFromDom();
      const newItem = { id: uid(), text };
      const idx = items.findIndex(i => i.id === targetId);
      if (idx === -1) {
        items.unshift(newItem);
      } else {
        items.splice(idx, 0, newItem);
      }
      saveItems();
      render();
      focusRow(newItem.id, true);
    }

    function insertAfter(targetId, text = '') {
      syncActiveRowFromDom();
      const newItem = { id: uid(), text };
      const idx = items.findIndex(i => i.id === targetId);
      if (idx === -1) {
        items.push(newItem);
      } else {
        items.splice(idx + 1, 0, newItem);
      }
      saveItems();
      render();
      focusRow(newItem.id, true);
    }

    function handleEnterInRow(el, itemId) {
      if (isCaretAtStart(el)) {
        insertBefore(itemId, '');
      } else {
        insertAfter(itemId, '');
      }
    }

    function deleteItem(id, focusPrev = false, toArchive = false) {
      syncActiveRowFromDom();
      const idx = items.findIndex(i => i.id === id);
      if (idx === -1) return;
      const removed = items[idx];

      if (toArchive && removed.text.trim() !== '') {
        archive.unshift({
          id: uid(),
          text: removed.text,
          deletedAt: Date.now()
        });
        saveArchive();
      }

      items.splice(idx, 1);
      if (items.length === 0) {
        items.push({ id: uid(), text: '' });
      }
      if (selectedId === id) {
        selectedId = items[Math.max(0, idx - 1)].id;
      }
      saveItems();
      render();
      renderArchive();
      if (focusPrev) {
        const prevItem = items[Math.max(0, idx - 1)];
        if (prevItem) focusRow(prevItem.id, true);
      }
    }

    function deleteFromArchive(id) {
      archive = archive.filter(i => i.id !== id);
      saveArchive();
      renderArchive();
    }

    function restoreFromArchive(id) {
      const idx = archive.findIndex(i => i.id === id);
      if (idx === -1) return;
      const [restored] = archive.splice(idx, 1);
      items.unshift({ id: uid(), text: restored.text });
      saveArchive();
      saveItems();
      render();
      renderArchive();
    }

    function startDrag(id, clientY) {
      const el = listEl.querySelector(`[data-id="${id}"]`);
      if (!el) return;

      isDragging = true;
      dragId = id;
      suppressClick = true;

      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      const sel = window.getSelection();
      if (sel) sel.removeAllRanges();

      if (navigator.vibrate) {
        try { navigator.vibrate(25); } catch (e) {}
      }

      const rect = el.getBoundingClientRect();
      dragOffsetY = clientY - rect.top;

      dragGhost = document.createElement('div');
      dragGhost.className = 'drag-ghost';
      dragGhost.textContent = el.textContent || ' ';
      dragGhost.style.top = rect.top + 'px';
      document.body.appendChild(dragGhost);

      el.classList.add('drag-placeholder');
      document.body.classList.add('dragging-active');
    }

    function moveDrag(clientY) {
      if (!isDragging || !dragGhost) return;
      dragGhost.style.top = (clientY - dragOffsetY) + 'px';

      const rows = Array.from(listEl.children);
      const currentIdx = items.findIndex(i => i.id === dragId);
      if (currentIdx === -1) return;

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const rowId = row.dataset.id;
        if (rowId === dragId) continue;
        const rect = row.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;

        if (i < currentIdx && clientY < midY) {
          const [moved] = items.splice(currentIdx, 1);
          items.splice(i, 0, moved);
          listEl.insertBefore(listEl.querySelector(`[data-id="${dragId}"]`), row);
          saveItems();
          break;
        } else if (i > currentIdx && clientY > midY) {
          const [moved] = items.splice(currentIdx, 1);
          items.splice(i, 0, moved);
          listEl.insertBefore(listEl.querySelector(`[data-id="${dragId}"]`), row.nextSibling);
          saveItems();
          break;
        }
      }
    }

    function endDrag() {
      clearTimeout(dragTimer);
      dragTimer = null;
      if (!isDragging) return;

      const el = listEl.querySelector(`[data-id="${dragId}"]`);
      if (el) el.classList.remove('drag-placeholder');
      if (dragGhost) {
        dragGhost.remove();
        dragGhost = null;
      }

      document.body.classList.remove('dragging-active');
      isDragging = false;
      dragId = null;
      saveItems();

      setTimeout(() => { suppressClick = false; }, 150);
    }

    function createRowEl(item) {
      const div = document.createElement('div');
      div.className = 'row';
      div.contentEditable = 'false';
      div.spellcheck = false;
      div.dataset.id = item.id;
      div.textContent = item.text;

      let swipeMode = null;
      let swipeDx = 0;

      div.addEventListener('focus', () => {
        selectedId = item.id;
      });

      div.addEventListener('blur', () => {
        item.text = div.textContent.replace(/\n/g, '');
        div.contentEditable = 'false';
        div.classList.remove('editing');
        saveItems();
      });

      div.addEventListener('beforeinput', (e) => {
        if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak') {
          e.preventDefault();
          handleEnterInRow(div, item.id);
        }
      });

      div.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleEnterInRow(div, item.id);
        } else if (e.key === 'Backspace' && div.textContent === '') {
          e.preventDefault();
          deleteItem(item.id, true, false);
        }
      });

      div.addEventListener('input', () => {
        const cleanText = div.textContent.replace(/\n/g, '');
        if (cleanText !== div.textContent) {
          div.textContent = cleanText;
          focusRow(item.id, true);
        }
        item.text = cleanText;
        saveItems();
      });

      div.addEventListener('contextmenu', (e) => {
        if (div.contentEditable !== 'true' || isDragging || dragTimer) {
          e.preventDefault();
        }
      });

      div.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        const t = e.touches[0];
        startX = t.clientX;
        startY = t.clientY;
        swipeMode = null;
        swipeDx = 0;
        selectedId = item.id;

        if (div.contentEditable !== 'true') {
          clearTimeout(dragTimer);
          dragTimer = setTimeout(() => {
            startDrag(item.id, t.clientY);
          }, 250);
        }
      }, { passive: true });

      div.addEventListener('touchmove', (e) => {
        if (e.touches.length !== 1) return;
        const t = e.touches[0];

        if (isDragging) {
          e.preventDefault();
          moveDrag(t.clientY);
          return;
        }

        const dx = t.clientX - startX;
        const dy = t.clientY - startY;

        if (swipeMode === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
          clearTimeout(dragTimer);
          dragTimer = null;
          if (div.contentEditable !== 'true' && Math.abs(dx) > Math.abs(dy) * 1.3 && dx < 0) {
            swipeMode = 'horizontal';
          } else {
            swipeMode = 'vertical';
          }
        }

        if (swipeMode === 'horizontal') {
          e.preventDefault();
          swipeDx = Math.min(0, dx);
          div.style.transition = 'none';
          div.style.transform = `translateX(${swipeDx}px)`;
          div.style.opacity = String(Math.max(0.2, 1 - Math.abs(swipeDx) / 160));
        }
      }, { passive: false });

      div.addEventListener('touchend', (e) => {
        const wasDragging = isDragging;
        endDrag();
        if (wasDragging) {
          swipeMode = null;
          swipeDx = 0;
          return;
        }

        if (swipeMode === 'horizontal') {
          if (swipeDx <= -SWIPE_THRESHOLD) {
            if (navigator.vibrate) {
              try { navigator.vibrate(15); } catch (err) {}
            }
            deleteItem(item.id, false, true);
          } else {
            div.style.transition = 'transform 0.15s ease, opacity 0.15s ease';
            div.style.transform = '';
            div.style.opacity = '';
          }
          swipeMode = null;
          swipeDx = 0;
          return;
        }

        if (swipeMode === 'vertical') {
          swipeMode = null;
          swipeDx = 0;
          return;
        }

        const t = e.changedTouches[0];
        if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) return;

        if (div.contentEditable !== 'true') {
          focusRow(item.id, true);
        }
      });

      div.addEventListener('touchcancel', () => {
        endDrag();
        swipeMode = null;
        swipeDx = 0;
        div.style.transition = 'transform 0.15s ease, opacity 0.15s ease';
        div.style.transform = '';
        div.style.opacity = '';
      });

      div.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        startX = e.clientX;
        startY = e.clientY;
        selectedId = item.id;

        if (div.contentEditable !== 'true') {
          clearTimeout(dragTimer);
          dragTimer = setTimeout(() => {
            startDrag(item.id, e.clientY);
          }, 250);
        }
      });

      div.addEventListener('click', () => {
        if (suppressClick) return;
        if (div.contentEditable !== 'true') {
          focusRow(item.id, true);
        }
      });

      return div;
    }

    function createArchiveRowEl(item) {
      const div = document.createElement('div');
      div.className = 'archive-row';
      div.textContent = item.text;

      let aStartX = 0;
      let aStartY = 0;
      let aSwipeMode = null;
      let aSwipeDx = 0;

      div.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        const t = e.touches[0];
        aStartX = t.clientX;
        aStartY = t.clientY;
        aSwipeMode = null;
        aSwipeDx = 0;
      }, { passive: true });

      div.addEventListener('touchmove', (e) => {
        if (e.touches.length !== 1) return;
        const t = e.touches[0];
        const dx = t.clientX - aStartX;
        const dy = t.clientY - aStartY;

        if (aSwipeMode === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
          aSwipeMode = Math.abs(dx) > Math.abs(dy) * 1.3 ? 'horizontal' : 'vertical';
        }

        if (aSwipeMode === 'horizontal') {
          e.preventDefault();
          aSwipeDx = dx;
          div.style.transition = 'none';
          div.style.transform = `translateX(${aSwipeDx}px)`;
          div.style.opacity = String(Math.max(0.2, 1 - Math.abs(aSwipeDx) / 160));
        }
      }, { passive: false });

      div.addEventListener('touchend', () => {
        if (aSwipeMode === 'horizontal') {
          if (aSwipeDx <= -SWIPE_THRESHOLD) {
            if (navigator.vibrate) {
              try { navigator.vibrate(15); } catch (err) {}
            }
            deleteFromArchive(item.id);
          } else if (aSwipeDx >= SWIPE_THRESHOLD) {
            if (navigator.vibrate) {
              try { navigator.vibrate(15); } catch (err) {}
            }
            restoreFromArchive(item.id);
          } else {
            div.style.transition = 'transform 0.15s ease, opacity 0.15s ease';
            div.style.transform = '';
            div.style.opacity = '';
          }
        }
        aSwipeMode = null;
        aSwipeDx = 0;
      });

      div.addEventListener('touchcancel', () => {
        aSwipeMode = null;
        aSwipeDx = 0;
        div.style.transition = 'transform 0.15s ease, opacity 0.15s ease';
        div.style.transform = '';
        div.style.opacity = '';
      });

      return div;
    }

    window.addEventListener('mousemove', (e) => {
      if (!isDragging && dragTimer) {
        if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) {
          clearTimeout(dragTimer);
          dragTimer = null;
        }
      } else if (isDragging) {
        e.preventDefault();
        moveDrag(e.clientY);
      }
    });

    window.addEventListener('mouseup', () => {
      endDrag();
    });

    function render() {
      listEl.innerHTML = '';
      for (const item of items) {
        listEl.appendChild(createRowEl(item));
      }
    }

    function renderArchive() {
      archiveEl.innerHTML = '';
      if (archive.length === 0) {
        archiveEl.style.display = 'none';
        return;
      }
      archiveEl.style.display = 'block';
      for (const item of archive) {
        archiveEl.appendChild(createArchiveRowEl(item));
      }
    }

    saveBtn.addEventListener('mousedown', (e) => {
      e.preventDefault();
    });

    saveBtn.addEventListener('click', (e) => {
      e.preventDefault();
      flushAllState();
      if (navigator.vibrate) {
        try { navigator.vibrate(15); } catch (err) {}
      }
      saveBtn.classList.add('saved');
      clearTimeout(saveFlashTimer);
      saveFlashTimer = setTimeout(() => {
        saveBtn.classList.remove('saved');
      }, 300);
    });

    items = loadItems();
    archive = loadArchive();
    saveItems();
    render();
    renderArchive();
  </script>
</body>
</html>
